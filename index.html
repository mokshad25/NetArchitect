<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Set the theme before first paint (no flash): ?theme= → saved choice → system preference. -->
    <script>
      (function () {
        var theme;
        try {
          var q = new URLSearchParams(location.search).get('theme');
          theme = q === 'dark' || q === 'light' ? q : localStorage.getItem('na-theme');
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <title>NetArchitect — Requirement-driven network topology designer</title>
    <meta
      name="description"
      content="Requirement-driven network topology designer. Enter device counts and requirements; get a recommended topology, an interactive diagram, a plain-English explanation and a full VLSM IP plan."
    />
    <meta name="theme-color" content="#F4EFE6" />
    <link rel="canonical" href="https://netarchitect.vercel.app/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
