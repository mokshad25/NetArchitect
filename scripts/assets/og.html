        margin-top: 64px;

        line-height: 1.02;
        letter-spacing: -0.02em;

      h1 em {

        padding: 20px;
        margin-top: -40px;

      .side svg {

        width: 100%;
        height: auto;
      }
      .t {
        font-family: 'JetBrains Mono';
        font-size: 9px;
        fill: #6b645a;
